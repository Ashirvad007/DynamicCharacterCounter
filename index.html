<!DOCTYPE html>
<html>
<head>
    <title>Character Counter</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff9966, #ff5e62);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box{
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            text-align: center;
            box-shadow: 0px 0px 15px gray;
        }

        textarea{
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 5px;
            resize: none;
        }

        h2{
            color: #333;
        }

        p{
            font-weight: bold;
        }

        #warning{
            color: red;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Character Counter</h2>

    <p>200 Characters Max</p>

    <textarea id="msg" placeholder="Type your message here..."></textarea>

    <p id="count">0 / 200 Characters</p>

    <p id="warning"></p>

</div>

<script>

let txt = document.getElementById("msg");
let count = document.getElementById("count");
let warning = document.getElementById("warning");

let max = 200;

txt.addEventListener("input", updateCount);

function updateCount()
{
    let len = txt.value.length;

    if(len > max)
    {
        txt.value = txt.value.substring(0,max);
        warning.innerHTML = "Character limit reached!";
        len = max;
    }
    else
    {
        warning.innerHTML = "";
    }

    count.innerHTML = len + " / " + max + " Characters";
}

</script>

</body>
</html>
